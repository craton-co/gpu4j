name: Bug Report
description: Report a defect or unexpected behavior in gpu4j.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps (or code snippet) to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include stack traces or logs if relevant.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide:
        - OS (e.g. Windows 11, Ubuntu 24.04, macOS 14)
        - JDK version (e.g. Temurin 17.0.10)
        - CratonVM / gpu4j version (e.g. 0.1.0)
      placeholder: |
        OS:
        JDK version:
        CratonVM version:
    validations:
      required: false

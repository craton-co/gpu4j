name: Feature Request
description: Suggest a new feature or enhancement for gpu4j.
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the feature you would like to see.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Use case / motivation
      description: What problem does this solve? Why is it valuable?
    validations:
      required: true
  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API (optional)
      description: If you have a sketch of the API or implementation, share it here.
      render: java
    validations:
      required: false

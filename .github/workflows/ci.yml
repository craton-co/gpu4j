name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [17, 21, 25]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, and verify Javadoc
        run: mvn -B -ntp -q verify javadoc:jar
      - name: Compile and run standalone example
        run: java -cp gpu4j-core/target/gpu4j-core-0.1.0.jar examples/Demo.java
      - name: Upload JaCoCo coverage
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: gpu4j-core/target/site/jacoco/jacoco.xml
